<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./style_6.css" rel="stylesheet"> 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
        <title>Sign_up</title>
</head>
<body>
<div class="heading">
  <h1>Sign-Up</h1>
</div>

<!-- form to collect information -->
<div class="form-wrapper">
  <div class="form-container">
    <form action="submitForm" id="signUpForm">
      <div class="mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" id="firstName" class="form-control" placeholder="First name" required>
      </div>

      <div class="mb-3">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" id="lastName" class="form-control" placeholder="Last name" required>
      </div>

      <div class="mb-3">
        <label for="birthDate" class="form-label">Date of Birth</label>
        <input type="date" id="birthDate" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="emailAddress" class="form-label">Email</label>
        <input type="email" id="emailAddress" class="form-control" placeholder="Enter your email here" required>
      </div>

      <div class="mb-3">
        <label for="passWord" class="form-label">Password</label>
<!-- /password limited to 8 charaters// -->
        <input 
          type="password" 
          id="passWord" 
          class="form-control" 
          placeholder="Max 8, include 1 number, 1 symbol, 1 uppercase" 
          maxlength="8"
          pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8}$" 
          title="Must contain at least 1 number, 1 uppercase letter, 1 symbol, and be up to 8 characters"
          required>
      </div>
    </form>
  </div>

  <!-- submit button separate -->
  <div class="btn-submit">
    <button type="submit" form="signUpForm" class="btn btn-custom"><a href="./message.html"></a>Submit</button>
  </div>
</div>
